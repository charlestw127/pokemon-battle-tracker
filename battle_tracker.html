<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>포켓몬 배틀 트래커</title>
<style>
  :root{
    --bg:#0f1216; --panel:#171c23; --card:#1e242e; --card2:#242b37; --line:#2e3743;
    --text:#e6eaf0; --dim:#8b96a5; --my:#4f8ef7; --opp:#f16a6a; --ok:#4cc38a; --warn:#f0b429;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{background:var(--bg); color:var(--text); font:13px/1.45 "Segoe UI","Malgun Gothic",sans-serif}
  button{font:inherit; color:inherit; background:var(--card2); border:1px solid var(--line); border-radius:6px; padding:3px 8px; cursor:pointer}
  button:hover{border-color:#4a5665}
  button.primary{background:var(--my); border-color:var(--my); color:#fff}
  button.danger{color:#ff9d9d}
  button.on{background:var(--ok); border-color:var(--ok); color:#08120d}
  input,select{font:inherit; color:var(--text); background:#12161c; border:1px solid var(--line); border-radius:6px; padding:3px 6px}
  input:focus,select:focus{outline:none; border-color:var(--my)}
  input[type=number]{width:52px; text-align:center}
  header{display:flex; align-items:center; gap:14px; padding:8px 14px; background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20}
  header h1{font-size:16px; margin-right:6px}
  header .grow{flex:1}
  .seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
  .seg button{border:none; border-radius:0; padding:4px 14px; background:transparent}
  .seg button.active{background:var(--my); color:#fff}
  main{display:grid; grid-template-columns:minmax(560px,1fr) 350px; grid-template-rows:minmax(0,1fr) auto; gap:10px; padding:10px; height:calc(100vh - 46px)}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px; overflow-y:auto; max-height:100%}
  .panel h2{font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px}
  .panel h2 .count{color:var(--dim); font-weight:normal; font-size:12px}
  #field-col{grid-column:1; grid-row:1; overflow-y:auto; max-height:100%; display:flex; flex-direction:column; gap:10px}
  #opp-panel{grid-column:2; grid-row:1}
  /* tabs: 배틀 view shows field+opponent, 팀 관리 view shows my team full-page */
  #my-panel{grid-column:1 / -1; grid-row:1 / -1; max-height:none}
  body[data-view="battle"] #my-panel{display:none}
  body[data-view="team"] #field-col, body[data-view="team"] #opp-panel{display:none}
  .teamrow{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start}
  #my-panel .card{min-width:280px; max-width:360px; flex:0 0 auto; margin-bottom:0}
  #my-panel .card.editing{min-width:500px; max-width:none}
  .itemicon{width:24px; height:24px; vertical-align:middle}
  button .itemicon{margin-right:3px}

  .card{background:var(--card); border:1px solid var(--line); border-radius:9px; padding:8px 10px; margin-bottom:8px}
  .card .head{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
  .card .head .nm{font-size:14px; font-weight:600}
  .card .head .form{color:var(--dim); font-size:11px}
  .row{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:5px}
  .muted{color:var(--dim)}
  .small{font-size:11px}
  .chip{display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; color:#fff; line-height:1.5}
  .cat{display:inline-block; padding:0 5px; border-radius:4px; font-size:10px; border:1px solid var(--line); color:var(--dim)}
  .cat.P{color:#ffb27d; border-color:#7d5230}
  .cat.S{color:#9dc4ff; border-color:#33507d}

  .fieldside{border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--panel)}
  .fieldside.opp{border-color:#5a3038}
  .fieldside.my{border-color:#2c4568}
  .fieldside > .sidehead{display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap}
  .fieldside > .sidehead .t{font-weight:700; font-size:14px}
  .benchrow{display:flex; gap:3px; margin-left:auto; flex-wrap:wrap}
  .benchbtn{padding:1px 2px; line-height:0; background:transparent; border:1px solid transparent; border-radius:8px; cursor:pointer}
  .benchbtn:hover{border-color:#4a5665; background:var(--card)}
  .benchbtn.on{opacity:.35; outline:1px solid var(--ok); cursor:default}
  .spr.bench{width:42px; height:42px}
  .fieldside.opp > .sidehead .t{color:var(--opp)}
  .fieldside.my > .sidehead .t{color:var(--my)}
  .slots{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .slots.single{grid-template-columns:1fr}
  .slot{background:var(--card); border:1px dashed var(--line); border-radius:9px; padding:9px; min-height:70px}
  .slot.filled{border-style:solid}
  .slot .empty{color:var(--dim); text-align:center; padding:18px 0}

  table.stats{border-collapse:collapse; margin-top:5px; width:100%}
  table.stats td,table.stats th{padding:1px 5px; font-size:12px; text-align:center}
  table.stats th{color:var(--dim); font-weight:normal}
  table.stats td.lbl{color:var(--dim); text-align:left}
  .rankbtn{width:20px; height:20px; padding:0; line-height:1; border-radius:5px; font-size:12px}
  .rk{display:inline-block; min-width:26px; text-align:center; font-weight:600}
  .rk.up{color:var(--ok)} .rk.dn{color:var(--opp)}

  .mv{border-top:1px solid var(--line); padding:6px 0}
  .mv .mvhead{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .mv .mvname{font-weight:600}
  .dmg{margin:3px 0 0 10px; font-size:12px}
  .dmg .tgt{color:var(--dim)}
  .dmg .pct{font-weight:600}
  .ko{display:inline-block; padding:0 6px; border-radius:8px; font-size:10.5px; background:#2a3240; color:#cfd8e3; margin-left:4px}
  .ko.k1{background:#7a2b2b; color:#ffd9d9}
  .ko.k2{background:#7a5a22; color:#ffedc9}
  .eff{display:inline-block; padding:0 6px; border-radius:8px; font-size:10.5px; font-weight:700}
  .eff.e4{background:#8c1d1d; color:#ffe3e3} .eff.e2{background:#8a4a15; color:#ffe8d2}
  .eff.e1{background:#2a3240; color:#aeb9c7} .eff.eh{background:#1e4d33; color:#c9f5dd}
  .eff.eq{background:#173a26; color:#9adbb6} .eff.e0{background:#3a3f46; color:#c5cbd3; text-decoration:line-through}

  .seen{width:26px; height:22px; padding:0; font-size:12px}
  .seen.yes{background:var(--ok); border-color:var(--ok); color:#08120d}
  .mvrow.unseen .mvname,.mvrow.unseen .chip,.mvrow.unseen .cat{opacity:.45}
  .mvrow.unseen .mvname{font-style:italic}

  .speedbox{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:9px 12px}
  .speedbox h3{font-size:13px; margin-bottom:6px; display:flex; gap:10px; align-items:center}
  .sprow{display:flex; align-items:center; gap:8px; padding:2px 0; font-size:12.5px}
  .sprow .side{width:34px; text-align:center; border-radius:5px; font-size:10.5px; padding:0 3px}
  .sprow .side.my{background:#1d3a6b; color:#bcd4ff} .sprow .side.opp{background:#6b2424; color:#ffc9c9}
  .sprow .nm{width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sprow b{color:#fff}

  .ac-wrap{position:relative; display:inline-block}
  .ac-list{position:fixed; z-index:100; background:#10151b; border:1px solid #3b4655; border-radius:8px; min-width:340px; max-height:440px; overflow-y:auto; display:none; box-shadow:0 10px 26px #000b}
  .ac-item{padding:6px 10px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px}
  .ac-item:hover{background:#223047}
  .ac-item .spr{width:34px; height:34px}
  .spr{image-rendering:pixelated; object-fit:contain; flex:none}
  .spr.sm{width:44px; height:44px}
  .spr.lg{width:68px; height:68px; margin:-6px 0}
  #toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#24405c; border:1px solid #4a6f96; color:#e8f1fa; padding:8px 18px; border-radius:9px; display:none; z-index:200; font-size:13px}
  #modal-bg{position:fixed; inset:0; background:#000b; z-index:150; display:flex; align-items:center; justify-content:center}
  .picker{background:var(--panel); border:1px solid #3b4655; border-radius:12px; width:min(720px,94vw); max-height:86vh; display:flex; flex-direction:column}
  .picker .phead{display:flex; gap:10px; align-items:center; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .picker .phead .t{font-weight:700}
  .picker .plist{overflow-y:auto; padding:10px 14px; display:grid; grid-template-columns:1fr 1fr; gap:4px 10px}
  .pmv{display:flex; align-items:center; gap:6px; padding:4px 8px; border:1px solid var(--line); border-radius:7px; cursor:pointer; font-size:12.5px; user-select:none}
  .pmv:hover{border-color:#4a5665}
  .pmv.sel{background:#1e4d33; border-color:var(--ok)}
  .pmv .pw{margin-left:auto; color:var(--dim); font-size:11px; flex:none}
  .battlebar{display:flex; align-items:center; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 12px}
  .battlebar .t{font-weight:700; font-size:13px}
  .battlebar label{color:var(--dim); font-size:12px; display:flex; align-items:center; gap:5px}
  .evrow input{width:46px}
  .editor{border-top:1px dashed var(--line); margin-top:7px; padding-top:7px}
  .editor .grp{margin-bottom:6px}
  .editor .grp .glbl{color:var(--dim); font-size:11px; margin-bottom:2px}
  .footer-note{color:var(--dim); font-size:11px; padding:2px 12px 8px; text-align:center}
  .durline{font-size:11.5px; color:var(--dim); margin-top:3px}
</style>
</head>
<body>
<header>
  <h1 id="app-title">⚔ 포켓몬 배틀 트래커</h1>
  <span class="seg">
    <button data-action="view" data-view="battle" id="tab-battle">⚔ 배틀</button>
    <button data-action="view" data-view="team" id="tab-team">팀 관리</button>
  </span>
  <span class="seg">
    <button data-action="mode" data-mode="single" id="btn-single">싱글</button>
    <button data-action="mode" data-mode="double" id="btn-double">더블</button>
  </span>
  <span class="muted small" id="lbl-level">Lv.50 기준</span>
  <span class="grow"></span>
  <span class="seg" id="lang-seg">
    <button data-action="lang" data-lang="ko">한국어</button>
    <button data-action="lang" data-lang="en">English</button>
    <button data-action="lang" data-lang="ja">日本語</button>
  </span>
  <span class="muted small" id="lbl-autosave">자동 저장됨</span>
  <button data-action="save-team" id="btn-save-team">팀 저장</button>
  <button data-action="load-team" id="btn-load-team">팀 불러오기</button>
  <input type="file" id="team-file" accept=".json" style="display:none">
  <button data-action="reset-opp" class="danger" id="btn-reset-opp">상대 초기화</button>
</header>

<main>
  <aside class="panel" id="my-panel"></aside>
  <section id="field-col"></section>
  <aside class="panel" id="opp-panel"></aside>
</main>
<div class="footer-note" id="footer-note"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script src="data.js"></script>

// ---------------- state ----------------
function makeMyMon(dex, nature, moves){
  const p = D.pokedex[dex];
  const evs = [4,0,0,0,0,0];
  evs[p.base[1] >= p.base[3] ? 1 : 3] = 252;
  evs[5] = 252;
  return {dex, nature: nature || "Adamant", item:"없음", ability:(p.abil && p.abil[0]) || "",
          ivs:[31,31,31,31,31,31], evs, moves:(moves||[]).slice(0,4)};
}
function makeSlot(i){ return {i, ranks:[0,0,0,0,0], burn:false, mega:null}; }
function initialState(){
  return {
    mode:"double",
    myTeam:(D.defaultTeam||[]).map(t => {
      const m = makeMyMon(t.dex, t.nature, t.moves);
      if(Array.isArray(t.ivs) && t.ivs.length === 6) m.ivs = t.ivs.slice();
      if(Array.isArray(t.evs) && t.evs.length === 6) m.evs = t.evs.slice();
      if(t.item) m.item = t.item;
      if(t.ability) m.ability = t.ability;
      return m;
    }),
    oppTeam:[],
    field:{my:[null,null], opp:[null,null]},
    tailwind:{my:false, opp:false},
    weather:"none",
    terrain:"none",
  };
}
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if(s && s.myTeam && s.field){
      if(!s.weather) s.weather = "none";
      if(!s.terrain) s.terrain = "none";
      s.myTeam.forEach(m => {
        if(m.ability === undefined) m.ability = (D.pokedex[m.dex].abil || [])[0] || "";
      });
      s.oppTeam.forEach(o => { if(o.spdTier === undefined) o.spdTier = ""; });
      const okItems = new Set(ITEMS);   // items no longer in the championship list -> 없음
      s.myTeam.forEach(m => { if(!okItems.has(m.item)) m.item = "없음"; });
      s.oppTeam.forEach(o => { if(!okItems.has(o.item)) o.item = "없음"; });
      for(const side of ["my","opp"]) s.field[side].forEach(sl => { if(sl && sl.mega === undefined) sl.mega = null; });
      return s;
    }
  }catch(e){}
  return null;
}
let state = load() || initialState();
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function commit(){ save(); render(); }

let ui = {editMy:null, movePicker:null, itemPicker:null, view:"battle"};   // transient UI state

// ---------------- stats & damage ----------------
const rankMul = r => r >= 0 ? (2+r)/2 : 2/(2-r);

function myStat(mon, i, dex){
  const b = D.pokedex[dex ?? mon.dex].base[i];
  const core = Math.floor((2*b + mon.ivs[i] + Math.floor(mon.evs[i]/4))/2);
  if(i === 0) return b === 1 ? 1 : core + 60;
  const n = D.natures[mon.nature];
  let nat = 1;
  if(n){ if(n.up === i) nat = 1.1; else if(n.down === i) nat = 0.9; }
  return Math.floor((core + 5)*nat);
}
// scen: "min"(무보정: IV31 EV0 무보정) / "max"(풀보정: IV31 EV252 +성격)
function oppStat(dex, i, scen){
  const b = D.pokedex[dex].base[i];
  if(i === 0){
    if(b === 1) return 1;
    return (scen === "min" ? Math.floor((2*b+31)/2) : Math.floor((2*b+31+63)/2)) + 60;
  }
  if(scen === "min") return Math.floor((2*b+31)/2) + 5;
  return Math.floor((Math.floor((2*b+31+63)/2) + 5) * 1.1);
}
function itemStatMul(item, i, ko){
  const id = identOf(item);
  if(id === "choice-scarf" && i === 5) return 1.5;
  if(id === "iron-ball"    && i === 5) return 0.5;
  if(id === "light-ball" && ko === "피카츄" && (i === 1 || i === 3)) return 2;
  return 1;
}
function bpItemMul(item, cat, moveType){
  const id = identOf(item);
  let mul = 1;
  if(id === "muscle-band" && cat === "P") mul *= 1.1;
  if(id === "wise-glasses" && cat === "S") mul *= 1.1;
  if(TYPE_BOOST[id] === moveType) mul *= 1.2;
  return mul;
}
function effStat(statVal, rank, item, i, ko){
  return Math.floor(Math.floor(statVal * rankMul(rank)) * itemStatMul(item, i, ko));
}
const pokeRound = x => (x % 1 > 0.5 ? Math.ceil(x) : Math.floor(x));
function typeEff(moveType, defTypes){
  const row = D.typeChart[moveType] || {};
  let e = 1;
  for(const t of defTypes) if(row[t] !== undefined) e *= row[t];
  return e;
}
// ---- weather & terrain ----
const isGrounded = (types, item) => identOf(item) === "iron-ball" || !types.includes("Flying");
// Ground moves hit Flying types holding 검은철구 (their Ground immunity is removed)
function typeEffFor(moveType, defTypes, defItem){
  const types = (moveType === "Ground" && identOf(defItem) === "iron-ball")
    ? defTypes.filter(t => t !== "Flying") : defTypes;
  return typeEff(moveType, types);
}
const GRASSY_HALVED = new Set([89, 222, 523]);   // 지진, 매그니튜드, 땅고르기
function adjPower(m, atkGrounded, defGrounded, atkItem){
  let mul = bpItemMul(atkItem, m.cat, m.type);
  const t = state.terrain;
  if(t === "electric" && m.type === "Electric" && atkGrounded) mul *= 1.3;
  if(t === "grassy"   && m.type === "Grass"    && atkGrounded) mul *= 1.3;
  if(t === "grassy"   && GRASSY_HALVED.has(m.id) && defGrounded) mul *= 0.5;
  if(t === "psychic"  && m.type === "Psychic"  && atkGrounded) mul *= 1.3;
  if(t === "misty"    && m.type === "Dragon"   && defGrounded) mul *= 0.5;
  return Math.max(1, pokeRound(m.power * mul));
}
function weatherMod(moveType){
  const w = state.weather;
  if(w === "sun"){  if(moveType === "Fire")  return 1.5; if(moveType === "Water") return 0.5; }
  if(w === "rain"){ if(moveType === "Water") return 1.5; if(moveType === "Fire")  return 0.5; }
  return 1;
}
function weatherDefMul(cat, defTypes){
  if(state.weather === "sand" && cat === "S" && defTypes.includes("Rock")) return 1.5;
  if(state.weather === "snow" && cat === "P" && defTypes.includes("Ice"))  return 1.5;
  return 1;
}
// returns [min,max] raw damage
function calcDamage(power, atk, def, {stab=false, eff=1, spread=false, burn=false, lifeOrb=false, expertBelt=false, berry=false, wmod=1}){
  if(power <= 0 || eff === 0) return [0,0];
  let base = Math.floor(Math.floor(Math.floor(22 * power * atk / def) / 50)) + 2;
  if(spread) base = pokeRound(base * 0.75);
  if(wmod !== 1) base = pokeRound(base * wmod);
  return [85,100].map(r => {
    let d = Math.floor(base * r / 100);
    if(stab) d = pokeRound(d * 1.5);
    d = Math.floor(d * eff);
    if(burn) d = Math.floor(d * 0.5);
    if(expertBelt && eff > 1) d = pokeRound(d * 4915 / 4096);
    if(lifeOrb) d = pokeRound(d * 5324 / 4096);
    if(berry) d = pokeRound(d * 0.5);
    return Math.max(1, d);
  });
}
// ---- mega evolution (in-field toggle; megas/primals are hidden from search) ----
const IS_MEGA_FORM = p => /^(Mega|Primal)\b/.test(p.form);
const MEGAS_BY_DEX = {};
D.pokedex.forEach((p, i) => {
  if(!IS_MEGA_FORM(p)) return;
  const baseIdx = D.pokedex.findIndex(q => q.en === p.en && q.form === "default");
  if(baseIdx >= 0) (MEGAS_BY_DEX[baseIdx] ||= []).push(i);
});
function megaLabel(mi){
  const p = D.pokedex[mi];
  if(p.form.startsWith("Primal")) return t("primal");
  const suffix = p.form.replace(/^Mega\s+/, "").replace(p.en, "").trim();
  return t("megaEvolve") + (suffix ? " " + suffix : "");
}
function megaControls(side, k, baseDex, s){
  const megas = MEGAS_BY_DEX[baseDex] || [];
  if(!megas.length) return "";
  if(s.mega != null)
    return `<button class="small on" data-action="mega" data-side="${side}" data-k="${k}" data-dex="">${t("megaOff")}</button>`;
  return megas.map(mi =>
    `<button class="small" data-action="mega" data-side="${side}" data-k="${k}" data-dex="${mi}">${megaLabel(mi)}</button>`).join("");
}
function koLabel(minPct, maxPct){
  if(maxPct <= 0) return "";
  if(minPct >= 100) return `<span class="ko k1">${t("ohko")}</span>`;
  const n = Math.ceil(100/minPct), m = Math.ceil(100/maxPct);
  if(m < n) return `<span class="ko k2">${t("rollN")(m)}</span><span class="ko">${t("guarShort")(n)}</span>`;
  return `<span class="ko ${n<=2?"k2":""}">${t("guarN")(n)}</span>`;
}
const pct = (d, hp) => Math.round(d/hp*1000)/10;
// small badges showing that weather / terrain / items changed this calc
function condMarks(wm, power, rawPower, dmul, eff, berry){
  if(eff === 0) return "";
  let s = "";
  if(wm > 1) s += ` <span class="small" style="color:var(--warn)">${t("wUp")}</span>`;
  else if(wm < 1) s += ` <span class="small muted">${t("wDn")}</span>`;
  if(power > rawPower) s += ` <span class="small" style="color:var(--warn)">${t("pUp")}</span>`;
  else if(power < rawPower) s += ` <span class="small muted">${t("pDn")}</span>`;
  if(dmul > 1) s += ` <span class="small muted">${t("dUp")}</span>`;
  if(berry) s += ` <span class="small muted">${t("berryHalf")}</span>`;
  return s;
}

// ---------------- html helpers ----------------
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const typeChips = types => types.map(ty =>
  `<span class="chip" style="background:${TYPE_COLORS[ty]}">${typeName(ty)}</span>`).join("");
function effChip(e){
  const cls = e >= 4 ? "e4" : e >= 2 ? "e2" : e === 1 ? "e1" : e === 0 ? "e0" : e <= 0.25 ? "eq" : "eh";
  const txt = e === 0.5 ? "×0.5" : e === 0.25 ? "×0.25" : "×" + e;
  return `<span class="eff ${cls}">${txt}</span>`;
}
const catBadge = c => `<span class="cat ${c}">${catName(c)}</span>`;
function monName(dex, big){
  const p = D.pokedex[dex];

  return `${natureName(key)} (${SS(n.up)}↑ ${SS(n.down)}↓)`;
}

// ---------------- damage rendering ----------------
// my fielded mon -> all fielded opp targets
function myMoveDamageHtml(slot, moveId){
  const m = MOVES_BY_ID[moveId];
  if(!m) return "";
  if(m.cat === "X" || m.power <= 0)
    return `<div class="dmg muted">${t("statusExcluded")}</div>`;
  const mon = state.myTeam[slot.i];
  const dex = slot.mega ?? mon.dex;
  const p = D.pokedex[dex];
  const atkIdx = m.cat === "P" ? 1 : 3;
  const atk = effStat(myStat(mon, atkIdx, dex), slot.ranks[atkIdx-1], mon.item, atkIdx, D.pokedex[mon.dex].ko);
  const stab = p.types.includes(m.type);
  const targets = fielded("opp");
  if(!targets.length) return `<div class="dmg muted">${t("oppFieldEmpty")}</div>`;
  const spread = state.mode === "double" && m.spread && targets.length > 1;
  const atkG = isGrounded(p.types, mon.item);
  const wm = weatherMod(m.type);
  return targets.map(({slot:ts}) => {
    const opp = state.oppTeam[ts.i];
    const tdex = ts.mega ?? opp.dex;
    const tp = D.pokedex[tdex];
    const e = typeEffFor(m.type, tp.types, opp.item);
    const dId = identOf(opp.item);
    const berry = RESIST_BERRY[dId] === m.type && (e > 1 || dId === "chilan-berry");
    const power = adjPower(m, atkG, isGrounded(tp.types, opp.item), mon.item);
    const dmul = weatherDefMul(m.cat, tp.types);
    const defIdx = m.cat === "P" ? 2 : 4;
    const lines = ["min","max"].map(scen => {
      const def = Math.floor(effStat(oppStat(tdex, defIdx, scen), ts.ranks[defIdx-1], opp.item, defIdx) * dmul);
      const hp = oppStat(tdex, 0, scen);
      const [lo,hi] = calcDamage(power, atk, def, {stab, eff:e, spread, wmod:wm, berry, burn:slot.burn && m.cat==="P",
        lifeOrb:identOf(mon.item)==="life-orb", expertBelt:identOf(mon.item)==="expert-belt"});
      if(e === 0) return null;
      return `${scen === "min" ? t("min") : t("max")} <span class="pct">${pct(lo,hp)}~${pct(hi,hp)}%</span> ${koLabel(pct(lo,hp), pct(hi,hp))}`;
    });
    return `<div class="dmg">→ <span class="tgt">${esc(dexName(tp))}</span> ${effChip(e)}
      ${e === 0 ? `<span class="muted">${t("noEffect")}</span>` : lines.join(` <span class="muted">·</span> `)}
      ${spread ? `<span class="muted small">${t("spreadNote")}</span>` : ""}${condMarks(wm, power, m.power, dmul, e, berry)}</div>`;
  }).join("");
}
// opp fielded mon's potential move -> all my fielded targets
function oppMoveDamageHtml(slot, moveId){
  const m = MOVES_BY_ID[moveId];
  if(!m) return "";
  if(m.cat === "X" || m.power <= 0) return `<div class="dmg muted">${t("statusNoPower")}</div>`;
  const opp = state.oppTeam[slot.i];
  const dex = slot.mega ?? opp.dex;
  const p = D.pokedex[dex];
  const stab = p.types.includes(m.type);
  const atkIdx = m.cat === "P" ? 1 : 3;
  const targets = fielded("my");
  if(!targets.length) return `<div class="dmg muted">${t("myFieldEmpty")}</div>`;
  const spread = state.mode === "double" && m.spread && targets.length > 1;
  const atkG = isGrounded(p.types, opp.item);
  const wm = weatherMod(m.type);
  return targets.map(({slot:ms}) => {
    const mine = state.myTeam[ms.i];
    const mdex = ms.mega ?? mine.dex;
    const mp = D.pokedex[mdex];
    const e = typeEffFor(m.type, mp.types, mine.item);
    const dId = identOf(mine.item);
    const berry = RESIST_BERRY[dId] === m.type && (e > 1 || dId === "chilan-berry");
    const power = adjPower(m, atkG, isGrounded(mp.types, mine.item), opp.item);
    const dmul = weatherDefMul(m.cat, mp.types);
    const defIdx = m.cat === "P" ? 2 : 4;
    const def = Math.floor(effStat(myStat(mine, defIdx, mdex), ms.ranks[defIdx-1], mine.item, defIdx) * dmul);
    const hp = myStat(mine, 0, mdex);
    if(e === 0) return `<div class="dmg">→ <span class="tgt">${esc(dexName(mp))}</span> ${effChip(0)} <span class="muted">${t("noEffect")}</span></div>`;
    const parts = ["min","max"].map(scen => {
      const atk = effStat(oppStat(dex, atkIdx, scen), slot.ranks[atkIdx-1], opp.item, atkIdx, D.pokedex[opp.dex].ko);
      const [lo,hi] = calcDamage(power, atk, def, {stab, eff:e, spread, wmod:wm, berry, burn:slot.burn && m.cat==="P",
        lifeOrb:identOf(opp.item)==="life-orb", expertBelt:identOf(opp.item)==="expert-belt"});
      return `${scen === "min" ? t("min") : t("max")} <span class="pct">${pct(lo,hp)}~${pct(hi,hp)}%</span> ${koLabel(pct(lo,hp), pct(hi,hp))}`;
    });
    return `<div class="dmg">→ <span class="tgt">${esc(dexName(mp))}</span> ${effChip(e)} ${parts.join(` <span class="muted">·</span> `)}
      ${spread ? `<span class="muted small">${t("spreadNote")}</span>` : ""}${condMarks(wm, power, m.power, dmul, e, berry)}</div>`;
  }).join("");
}

// ---------------- field helpers ----------------
function slotsFor(side){ return state.mode === "single" ? [0] : [0,1]; }
function fielded(side){
  return slotsFor(side).map(k => ({k, slot: state.field[side][k]})).filter(x => x.slot).map(x => x);
}
function isFielded(side, teamIdx){
  return state.field[side].some((s,k) => s && s.i === teamIdx && slotsFor(side).includes(k));
}
function placeOnField(side, teamIdx, slotK){
  state.field[side][slotK] = makeSlot(teamIdx);
  commit();
}

// ---------------- render: speed panel ----------------
function renderSpeed(){
  const rows = [];
  for(const {slot:s} of fielded("my")){
    const mon = state.myTeam[s.i];
    const dex = s.mega ?? mon.dex;
    let v = effStat(myStat(mon, 5, dex), s.ranks[4], mon.item, 5);
    if(state.tailwind.my) v *= 2;
    rows.push({side:"my", name:dexName(D.pokedex[dex]) + (s.mega != null ? "◆" : ""), key:v, html:`<b>${v}</b>${state.tailwind.my ? ` <span class="small muted">${t("twNote")}</span>` : ""}`});
  }
  for(const {slot:s} of fielded("opp")){
    const opp = state.oppTeam[s.i];
    const dex = s.mega ?? opp.dex;
    const tw = state.tailwind.opp ? 2 : 1;
    const rmul = rankMul(s.ranks[4]);
    const f = base => Math.floor(Math.floor(base * rmul) * tw);
    const mubo = f(oppStat(dex, 5, "min"));
    const jun  = f(Math.floor((2*D.pokedex[dex].base[5]+31+63)/2)+5);
    const choe = f(oppStat(dex, 5, "max"));
    const scarf = Math.floor(choe * 1.5);
    const hasScarf = identOf(opp.item) === "choice-scarf";
    const tier = opp.spdTier || "";
    const vals = {min:mubo, jun:jun, max:choe, scarf:scarf};
    const seg = (key, label, val) => {
      const on = tier === key || (!tier && key === "scarf" && hasScarf);
      const style = on ? "color:var(--warn); font-weight:700" : tier ? "opacity:.4" : "";
      return `<span style="${style}">${label} <b>${val}</b></span>`;
    };
    const sel = `<select data-field="opp-spdtier" data-oi="${s.i}" title="${t("tierTitle")}">
      <option value="">${t("tierQ")}</option>
      <option value="min" ${tier==="min"?"selected":""}>${t("spdMin")}</option>
      <option value="jun" ${tier==="jun"?"selected":""}>${t("spdJun")}</option>
      <option value="max" ${tier==="max"?"selected":""}>${t("spdMax")}</option>
      <option value="scarf" ${tier==="scarf"?"selected":""}>${t("spdScarf")}</option></select>`;
    rows.push({side:"opp", name:dexName(D.pokedex[dex]) + (s.mega != null ? "◆" : ""),
      key: tier ? vals[tier] : (hasScarf ? scarf : choe),
      html:`${seg("min",t("spdMin"),mubo)} · ${seg("jun",t("spdJun"),jun)} · ${seg("max",t("spdMax"),choe)} · ${seg("scarf",t("spdScarf"),scarf)} ${sel}${state.tailwind.opp ? ` <span class="small muted">${t("twNote")}</span>` : ""}`});
  }
  rows.sort((a,b) => b.key - a.key);
  return `<div class="speedbox"><h3>${t("speedTitle")}
      <button class="${state.tailwind.opp ? "on" : ""}" data-action="tw" data-side="opp">${t("twOpp")}</button>
      <button class="${state.tailwind.my ? "on" : ""}" data-action="tw" data-side="my">${t("twMy")}</button>
      <span class="small muted">${t("fastFirst")}</span></h3>
    ${rows.length ? rows.map(r => `<div class="sprow"><span class="side ${r.side}">${r.side === "my" ? t("sideMy") : t("sideOpp")}</span><span class="nm">${esc(r.name)}</span>${r.html}</div>`).join("") : `<div class="muted small">${t("noField")}</div>`}
  </div>`;
}

}

// megas/primals are excluded from search — add the base form and mega-evolve on the field
// index is rebuilt on language switch; search strings match any of ko/en/ja
const DEX_ITEMS = [], MOVE_ITEMS = [];
function buildSearchIndexes(){
  DEX_ITEMS.length = 0;
  D.pokedex.forEach((p, i) => {
    if(IS_MEGA_FORM(p)) return;
    DEX_ITEMS.push({
      v: i,
      s: (p.ko + " " + p.en + " " + p.ja + " " + (p.form !== "default" ? p.form : "")).toLowerCase(),
      h: `${sprImg(i, "")}${esc(dexName(p))}${p.form !== "default" ? ` <span class="small muted">${esc(p.form)}</span>` : ""} ${typeChips(p.types)} <span class="small muted">${p.base.join("/")}</span>`,
    });
  });
  MOVE_ITEMS.length = 0;
  D.moves.forEach(m => MOVE_ITEMS.push({
    v: m.id,
    s: (m.ko + " " + m.en + " " + m.ja).toLowerCase(),
    h: `<span class="chip" style="background:${TYPE_COLORS[m.type]}">${typeName(m.type)}</span> ${esc(moveName(m))} ${catBadge(m.cat)} <span class="small muted">${m.power ? t("power") + " " + m.power : t("statusMove")}</span>`,
  }));
}
buildSearchIndexes();

// dropdown is position:fixed so the scrolling side panels can't clip it
function positionList(inp, list){
  const r = inp.getBoundingClientRect();
  const below = window.innerHeight - r.bottom;
  list.style.minWidth = Math.max(340, r.width) + "px";
  list.style.left = Math.max(6, Math.min(r.left, window.innerWidth - 370)) + "px";
  if(below < 300 && r.top > below){
    list.style.top = "auto";
    list.style.bottom = (window.innerHeight - r.top + 4) + "px";
    list.style.maxHeight = Math.min(440, r.top - 12) + "px";
  } else {
    list.style.bottom = "auto";
    list.style.top = (r.bottom + 4) + "px";
    list.style.maxHeight = Math.min(440, below - 12) + "px";
  }
}
function bindSearchInputs(){
  document.querySelectorAll(".ac-input").forEach(inp => {
    const list = inp.parentElement.querySelector(".ac-list");
    let items = inp.dataset.kind === "dex" ? DEX_ITEMS : MOVE_ITEMS;
    let limited = false;
    // my-team move slots: limit to what that pokemon can actually learn
    const ctx = inp.dataset.ctx || "";
    if(inp.dataset.kind === "move" && ctx.startsWith("my-move:")){
      const teamIdx = +ctx.split(":")[1];
      const mon = state.myTeam[teamIdx];
      const learn = mon && new Set(D.pokedex[mon.dex].learn || []);
      if(learn && learn.size){ items = MOVE_ITEMS.filter(it => learn.has(it.v)); limited = true; }
    }
    const search = () => {
      const q = inp.value.trim().toLowerCase();
      if(!q && !limited){ list.style.display = "none"; list.innerHTML = ""; return; }
      const cap = q ? 20 : Infinity;   // empty query on a learnset list: browse everything
      const res = [];
      for(const it of items){ if(!q || it.s.includes(q)){ res.push(it); if(res.length >= cap) break; } }
      list.innerHTML = res.map(it => `<div class="ac-item" data-v="${it.v}">${it.h}</div>`).join("");
      list.style.display = res.length ? "block" : "none";
      if(res.length) positionList(inp, list);
      list.querySelectorAll(".ac-item").forEach(el => el.addEventListener("mousedown", e => {
        e.preventDefault();
        onPick(inp.dataset.ctx, +el.dataset.v);
      }));
    };
    inp.addEventListener("input", search);
    inp.addEventListener("focus", search);
    inp.addEventListener("blur", () => setTimeout(() => { list.style.display = "none"; }, 150));
  });
}
// close dropdowns when a panel scrolls (their fixed position would go stale)
document.addEventListener("scroll", e => {
  if(e.target.closest && e.target.closest(".ac-list")) return;
  document.querySelectorAll(".ac-list").forEach(l => l.style.display = "none");
}, true);
function onPick(ctx, v){
  const [kind, a, b] = ctx.split(":");
  if(kind === "my-add"){ if(state.myTeam.length < 6) state.myTeam.push(makeMyMon(v)); }
  else if(kind === "my-dex"){
    const mon = state.myTeam[+a];
    mon.dex = v;
    mon.ability = (D.pokedex[v].abil || [])[0] || "";
  }
  else if(kind === "my-move"){
    const mon = state.myTeam[+a];
    while(mon.moves.length <= +b && mon.moves.length < 4) mon.moves.push(null);
    mon.moves[+b] = v;
    mon.moves = mon.moves.filter(x => x != null).slice(0,4);
  }
  else if(kind === "opp-add"){ if(state.oppTeam.length < 6) state.oppTeam.push({dex:v, item:"없음", moves:[], note:"", spdTier:""}); }
  commit();
}

// ---------------- events ----------------
function removeFromTeam(side, idx){
  const team = side === "my" ? state.myTeam : state.oppTeam;
  team.splice(idx, 1);
  state.field[side] = state.field[side].map(s => {
    if(!s) return null;
    if(s.i === idx) return null;
    if(s.i > idx) s.i--;
    return s;
  });
}
document.addEventListener("click", e => {
  // item-picker row: set item and close
  const pit = e.target.closest && e.target.closest(".pitem");
  if(pit && ui.itemPicker != null){
    const t = ui.itemPicker;
    const holder = t.side === "my" ? state.myTeam[t.idx] : state.oppTeam[t.idx];
    if(holder) holder.item = pit.dataset.item;
    ui.itemPicker = null;
    commit();
    return;
  }
  // move-picker row toggle (no full re-render: keeps scroll/filter position)
  const pmv = e.target.closest && e.target.closest(".pmv");
  if(pmv && ui.movePicker != null){
    const opp = state.oppTeam[ui.movePicker];
    const mid = +pmv.dataset.mid;
    const ix = opp.moves.findIndex(m => m.id === mid);
    if(ix >= 0) opp.moves.splice(ix, 1);
    else opp.moves.push({id:mid, seen:false});
    save();
    pmv.classList.toggle("sel", ix < 0);
    const cnt = document.getElementById("pick-count");
    if(cnt) cnt.textContent = opp.moves.length;
    return;
  }
  if(e.target.id === "modal-bg"){ ui.movePicker = null; ui.itemPicker = null; render(); return; }
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const d = btn.dataset;
  switch(d.action){
    case "lang":
      if(lang !== d.lang){
        lang = d.lang;
        localStorage.setItem(LANG_KEY, lang);
        buildSearchIndexes();
        render();
      }
      break;
    case "view": ui.view = d.view; render(); break;
    case "pick-moves": ui.movePicker = +d.oi; render(); break;
    case "pick-item": ui.itemPicker = {side:d.side, idx:+d.i}; render(); break;
    case "close-picker": ui.movePicker = null; ui.itemPicker = null; render(); break;
    case "mode":
      state.mode = d.mode;
      if(state.mode === "single"){ state.field.my[1] = null; state.field.opp[1] = null; }
      commit(); break;
    case "tw": state.tailwind[d.side] = !state.tailwind[d.side]; commit(); break;
    case "bench": {
      const side = d.side, i = +d.i;
      if(isFielded(side, i)) break;
      const k = slotsFor(side).find(k => !state.field[side][k]);
      if(k === undefined){
        if(state.mode === "single"){ ui.view = "battle"; state.field[side][0] = makeSlot(i); commit(); }
        else toast(t("fieldFull"));
        break;
      }
      ui.view = "battle";
      placeOnField(side, i, k);
      break;
    }
    case "unfield": state.field[d.side][+d.k] = null; commit(); break;
    case "rank": {
      const s = state.field[d.side][+d.k]; if(!s) break;
      const i = +d.stat - 1;
      s.ranks[i] = Math.max(-6, Math.min(6, s.ranks[i] + (+d.d)));
      commit(); break;
    }
    case "rankreset": { const s = state.field[d.side][+d.k]; if(s) s.ranks = [0,0,0,0,0]; commit(); break; }
    case "mega": {
      const s = state.field[d.side][+d.k];
      if(s){ s.mega = d.dex === "" ? null : +d.dex; commit(); }
      break;
    }
    case "seen": { const mv = state.oppTeam[+d.oi].moves[+d.mi]; mv.seen = !mv.seen; commit(); break; }
    case "opp-move-del": state.oppTeam[+d.oi].moves.splice(+d.mi, 1); commit(); break;
    case "mymove-del": state.myTeam[+d.i].moves.splice(+d.mi, 1); commit(); break;
    case "edit-my": ui.editMy = ui.editMy === +d.i ? null : +d.i; render(); break;
    case "edit-close": ui.editMy = null; render(); break;
    case "del-my": if(confirm(t("delMyConfirm"))){ removeFromTeam("my", +d.i); if(ui.editMy === +d.i) ui.editMy = null; commit(); } break;
    case "del-opp": if(confirm(t("delOppConfirm"))){ removeFromTeam("opp", +d.i); commit(); } break;
    case "save-team": saveTeamJson(); break;
    case "load-team": document.getElementById("team-file").click(); break;
    case "reset-opp":
      if(confirm(t("resetConfirm"))){
        state.oppTeam = [];
        state.field.opp = [null, null];
        state.tailwind = {my:false, opp:false};
        state.weather = "none";
        state.terrain = "none";
        state.field.my.forEach(s => { if(s){ s.ranks = [0,0,0,0,0]; s.burn = false; } });
        commit();
        toast(t("resetDone"));
      }
      break;
  }
});

// ---- my_team.json save / load ----
function teamJson(){
  return JSON.stringify({team: state.myTeam.map(mon => {
    const p = D.pokedex[mon.dex];
    return {
      name: p.ko, name_en: p.en, form: p.form,
      nature: mon.nature, item: mon.item, ability: mon.ability, types: p.types,
      ivs: mon.ivs, evs: mon.evs,
      // name/power/category/type kept for compatibility with 실수치.py
      moves: mon.moves.map(id => MOVES_BY_ID[id]).filter(Boolean).map(m => ({
        name: m.ko, id: m.id, power: m.power,
        category: m.cat === "P" ? "physical" : m.cat === "S" ? "special" : "status",
        type: m.type,
      })),
    };
  })}, null, 2);
}
async function saveTeamJson(){
  const text = teamJson();
  if(window.showSaveFilePicker){
    try{
      const h = await showSaveFilePicker({suggestedName:"my_team.json",
        types:[{description:"JSON", accept:{"application/json":[".json"]}}]});
      const w = await h.createWritable();
      await w.write(text);
      await w.close();
      toast(t("savedOk"));
      return;
    }catch(e){
      if(e && e.name === "AbortError") return;   // user cancelled the picker
    }
  }
  const blob = new Blob([text], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "my_team.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast(t("downloadedNote"));
}
function importMyTeam(obj){
  const team = [];
  for(const mem of (obj.team || []).slice(0, 6)){
    let idx = DEX_BY_KEY[(mem.name || "") + "|" + (mem.form || "default")];
    if(idx === undefined) idx = DEX_BY_KEY[mem.name];
    if(idx === undefined) continue;
    const mon = makeMyMon(idx, mem.nature);
    if(mem.item && ITEMS.includes(mem.item)) mon.item = mem.item;
    if(mem.ability) mon.ability = mem.ability;
    if(Array.isArray(mem.ivs) && mem.ivs.length === 6) mon.ivs = mem.ivs.map(Number);
    if(Array.isArray(mem.evs) && mem.evs.length === 6) mon.evs = mem.evs.map(Number);
    mon.moves = [];
    for(const mv of (mem.moves || []).slice(0, 4)){
      const id = (mv.id && MOVES_BY_ID[mv.id]) ? mv.id : MOVE_BY_KO[mv.name];
      if(id) mon.moves.push(id);
    }
    team.push(mon);
  }
  if(team.length){
    state.myTeam = team;
    state.field.my = [null, null];
    ui.editMy = null;
    commit();
    toast(t("teamLoaded")(team.length));
  } else alert(t("teamReadFail"));
}
document.getElementById("team-file").addEventListener("change", e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const s = JSON.parse(rd.result);
      if(s && s.team) importMyTeam(s);                       // my_team.json
      else if(s && s.myTeam && s.field){ state = s; if(!s.weather) s.weather="none"; if(!s.terrain) s.terrain="none"; commit(); }  // old full save
      else alert(t("notTeamFile"));
    }catch(err){ alert(t("fileReadFail") + err.message); }
  };
  rd.readAsText(f, "utf-8");
  e.target.value = "";
});
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.style.display = "none"; }, 2800);
}
document.addEventListener("change", e => {
  const el = e.target.closest("[data-field]");
  if(!el) return;
  const d = el.dataset;
  switch(d.field){
    case "nature": state.myTeam[+d.i].nature = el.value; break;
    case "ability": state.myTeam[+d.i].ability = el.value; break;
    case "iv":     state.myTeam[+d.i].ivs[+d.s] = Math.max(0, Math.min(31, +el.value || 0)); break;
    case "ev":     state.myTeam[+d.i].evs[+d.s] = Math.max(0, Math.min(252, +el.value || 0)); break;
    case "burn":   { const s = state.field[d.side][+d.k]; if(s) s.burn = el.checked; break; }
    case "opp-note": state.oppTeam[+d.oi].note = el.value; break;
    case "opp-spdtier": state.oppTeam[+d.oi].spdTier = el.value; break;
    case "weather": state.weather = el.value; break;
    case "terrain": state.terrain = el.value; break;
  }
  commit();
});

// ---------------- main render ----------------
function renderChrome(){
  document.documentElement.lang = lang;
  document.title = t("title");
  document.getElementById("app-title").textContent = "⚔ " + t("title");
  document.getElementById("tab-battle").textContent = t("tabBattle");
  document.getElementById("tab-team").textContent = t("tabTeam");
  document.getElementById("btn-single").textContent = t("single");
  document.getElementById("btn-double").textContent = t("double");
  document.getElementById("lbl-level").textContent = t("lv");
  document.getElementById("lbl-autosave").textContent = t("autosave");
  document.getElementById("btn-save-team").textContent = t("saveTeam");
  document.getElementById("btn-load-team").textContent = t("loadTeam");
  document.getElementById("btn-reset-opp").textContent = t("resetOpp");
  document.getElementById("footer-note").textContent = t("footer");
  document.querySelectorAll("#lang-seg button").forEach(b =>
    b.classList.toggle("active", b.dataset.lang === lang));
}
function render(){
  document.body.dataset.view = ui.view;
  renderChrome();
  document.getElementById("tab-battle").classList.toggle("active", ui.view === "battle");
  document.getElementById("tab-team").classList.toggle("active", ui.view === "team");
  document.getElementById("btn-single").classList.toggle("active", state.mode === "single");
  document.getElementById("btn-double").classList.toggle("active", state.mode === "double");
  renderMyPanel();
  renderField();
  renderOppPanel();
  renderModal();
  bindSearchInputs();
}
render();
</script>
